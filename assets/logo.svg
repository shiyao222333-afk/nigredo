<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#17131f"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b69be0"/>
      <stop offset="100%" stop-color="#5a3f86"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#3d2a5e"/>
      <stop offset="100%" stop-color="#8a5fc0"/>
    </linearGradient>
    <linearGradient id="vaporGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#9a78c8"/>
      <stop offset="100%" stop-color="#d8c4f0"/>
    </linearGradient>
    <linearGradient id="emberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#8a6a2a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#9a78c8" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="essGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#8a5fc0" flood-opacity="0.45"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="emberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#c9a24a" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="circleClip"><circle cx="256" cy="256" r="224"/></clipPath>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#8a5fc0" stroke-width="1.5" stroke-opacity="0.15"/>

  <g opacity="0.05" clip-path="circleClip">
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#9a78c8"/>
    </pattern>
    <rect x="32" y="32" width="448" height="448" fill="url(#grid)"/>
  </g>

  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#glassGrad)" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="6 18"/>
    <circle cx="0" cy="0" r="195" fill="none" stroke="#9a78c8" stroke-width="0.5" stroke-opacity="0.06"/>

    <!-- === 底部暗焰（黑化加热） === -->
    <g transform="translate(0, 120)" filter="url(#emberGlow)">
      <path d="M-30,8 Q-22,-22 -10,2 Q-6,-18 0,-2 Q6,-18 10,2 Q22,-22 30,8 Z" fill="url(#emberGrad)" opacity="0.7"/>
      <path d="M-16,8 Q-12,-10 -4,2 Q0,-12 4,2 Q12,-10 16,8 Z" fill="#e0c074" opacity="0.85"/>
    </g>

    <!-- === 蒸馏烧瓶 === -->
    <g filter="url(#shadow)">
      <!-- 球部液体 -->
      <ellipse cx="0" cy="72" rx="42" ry="34" fill="url(#liquidGrad)" filter="url(#essGlow)" opacity="0.92"/>
      <!-- 球部玻璃 -->
      <circle cx="0" cy="58" r="50" fill="#0e0c18" fill-opacity="0.35" stroke="url(#glassGrad)" stroke-width="2.5"/>
      <circle cx="0" cy="58" r="50" fill="#b69be0" fill-opacity="0.05"/>
      <!-- 颈 -->
      <rect x="-13" y="-58" width="26" height="80" rx="6" fill="#0e0c18" fill-opacity="0.35" stroke="url(#glassGrad)" stroke-width="2.5"/>
      <rect x="-13" y="-58" width="26" height="80" rx="6" fill="#b69be0" fill-opacity="0.04"/>
      <!-- 瓶口 -->
      <ellipse cx="0" cy="-58" rx="13" ry="4" fill="#5a3f86" stroke="#b69be0" stroke-width="1.5"/>
    </g>

    <!-- === 弯管（冷凝） === -->
    <g filter="url(#shadow)">
      <path d="M0,-58 L42,-58 Q58,-58 58,-42 L58,-6" fill="none" stroke="url(#glassGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0,-58 L42,-58 Q58,-58 58,-42 L58,-6" fill="none" stroke="#0e0c18" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    </g>

    <!-- === 暗色蒸汽（动画） === -->
    <g filter="url(#glow)" opacity="0.8">
      <path d="M58,-12 Q52,-45 64,-78 Q54,-108 70,-140" fill="none" stroke="url(#vaporGrad)" stroke-width="4" stroke-linecap="round">
        <animate attributeName="opacity" values="0.8;0.25;0.8" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M66,-10 Q74,-42 62,-76 Q72,-104 58,-138" fill="none" stroke="url(#vaporGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- === 角落齿轮（旋转，系列一致） === -->
    <g transform="translate(-118, -64)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 -118 -64" to="360 -118 -64" dur="12s" repeatCount="indefinite" additive="replace"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#glassGrad)" stroke-width="2" opacity="0.7"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#9a78c8" stroke-width="1.5" opacity="0.5"/>
      <g stroke="#9a78c8" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
        <line x1="0" y1="-20" x2="0" y2="-26"/>
        <line x1="14.1" y1="-14.1" x2="18.4" y2="-18.4"/>
        <line x1="20" y1="0" x2="26" y2="0"/>
        <line x1="14.1" y1="14.1" x2="18.4" y2="18.4"/>
        <line x1="0" y1="20" x2="0" y2="26"/>
        <line x1="-14.1" y1="14.1" x2="-18.4" y2="18.4"/>
        <line x1="-20" y1="0" x2="-26" y2="0"/>
        <line x1="-14.1" y1="-14.1" x2="-18.4" y2="-18.4"/>
      </g>
    </g>

    <!-- === 数据节点 === -->
    <g transform="translate(118, -72)" filter="url(#glow)">
      <circle cx="0" cy="0" r="5" fill="#9a78c8" opacity="0.9"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#9a78c8" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#5a3f86" stroke-width="0.8" opacity="0.2"/>
      <line x1="0" y1="5" x2="0" y2="18" stroke="#9a78c8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <circle cx="0" cy="20" r="2.5" fill="#9a78c8" opacity="0.7"/>
    </g>

    <!-- === 暗金火花 === -->
    <g opacity="0.7">
      <circle cx="40" cy="150" r="2" fill="#c9a24a"><animate attributeName="cy" values="150;130;108" dur="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.3;0" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="155" r="1.5" fill="#e0c074"><animate attributeName="cy" values="155;134;112" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.3;0" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="-36" cy="150" r="2" fill="#9a78c8"><animate attributeName="cy" values="150;128;104" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.2;0" dur="2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- === 脉冲光环 === -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#9a78c8" stroke-width="1.5" opacity="0.15">
      <animate attributeName="r" values="130;160;190" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.05;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#d8c4f0" opacity="0.6">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="80" y1="460" x2="432" y2="460" stroke="url(#glassGrad)" stroke-width="0.5" opacity="0.15"/>
</svg>
